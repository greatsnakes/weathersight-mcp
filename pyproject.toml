[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathersight-mcp"
version = "1.0.0"
authors = [
    {name = "Weathersight LLC", email = "contact@weathersight.io"},
]
description = "MCP client for Weathersight weather APIs - Connect Claude Desktop to professional weather data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["weather", "climate", "mcp", "claude", "ai", "api", "meteorology"]
dependencies = [
    "requests>=2.25.0",
    "urllib3>=1.26.0",
]

[project.urls]
Homepage = "https://weathersight.io"
Documentation = "https://weathersight.io/docs"
Repository = "https://github.com/weathersight/weathersight-mcp"
"Bug Reports" = "https://github.com/weathersight/weathersight-mcp/issues"
"Source Code" = "https://github.com/weathersight/weathersight-mcp"

[project.scripts]
weathersight-mcp = "weathersight_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "twine",
    "build",
]

[tool.setuptools]
py-modules = ["weathersight_mcp"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=weathersight_mcp --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["weathersight_mcp"]
omit = [
    "tests/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
